[project]
name = "test_support"
version = "0.1.0"
description = "Shared accuracy/GPU test helpers for pybasin's test suites (not a published package)"
authors = [{ name = "Adrian Wix", email = "adrianwix18@gmail.com" }]
requires-python = ">=3.12,<3.14"
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pytest>=7.4.0",
    "scikit-learn>=1.7.1",
    "torch>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["gpu: Whole-pipeline tests requiring a CUDA GPU"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-q", "--no-header", "--tb=short"]
