[project]
name = "pybasin"
version = "0.2.0"
description = "Basin stability estimation for dynamical systems"
authors = [{ name = "Adrian Wix", email = "adrianwix18@gmail.com" }]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12,<3.14"
keywords = [
    "dynamical systems",
    "basin stability",
    "nonlinear dynamics",
    "attractors",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.10.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.17.0",
    "torch>=2.0.0",
    "torchdiffeq>=0.2.0",
    "pandas>=2.0.0",
    "packaging>=23.0",
    "safetensors>=0.7.0",
    "triton>=3.7.1",
]

[project.urls]
Documentation = "https://adrianwix.github.io/pybasin/pybasin/"
Repository = "https://github.com/adrianwix/pybasin"

[project.optional-dependencies]
jax = ["jax>=0.8.0", "diffrax>=0.7.0"]
interactive = ["plotly>=5.18.0", "dash>=2.14.0", "dash-mantine-components>=0.14.0"]
tsfresh = ["tsfresh>=0.21.1"]
nolds = ["nolds>=0.6.3"]
torchode = ["torchode>=1.0.0"]
all = [
    "pybasin[jax]",
    "pybasin[interactive]",
    "pybasin[tsfresh]",
    "pybasin[nolds]",
    "pybasin[torchode]",
    "pybasin[cuml]",
]
cuml = [
    "cuml-cu13==26.6.*",
]

[build-system]
requires = ["uv_build>=0.6.6,<0.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-q", "--no-header", "--tb=short"]
