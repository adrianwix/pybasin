# pytest.ini - Pytest configuration

[pytest]
testpaths =
    packages/pybasin/tests
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for different test types
markers =
    unit: Unit tests for individual components
    integration: Integration tests comparing with MATLAB bSTAB
    slow: Tests that take a long time to run
    gpu: Whole-pipeline tests requiring a CUDA GPU with cuML installed
    
# Coverage options
addopts =
    --strict-markers
    --strict-config
    -ra
    --showlocals
    --tb=short
    -v
    -s

# Simplify log format (filename:line instead of full logger path)
log_format = %(filename)s:%(lineno)d %(message)s
log_cli_format = %(filename)s:%(lineno)d %(message)s

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Test output
console_output_style = progress
