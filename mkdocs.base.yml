site_author: Adrian Wix
repo_url: https://github.com/adrianwix/pybasin
repo_name: adrianwix/pybasin
edit_uri: blob/main/

theme:
  name: material
  palette:
    - media: ""
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.tabs.link

markdown_extensions:
  pymdownx.highlight:
    anchor_linenums: true
  pymdownx.superfences: {}
  pymdownx.inlinehilite: {}
  pymdownx.snippets: {}
  pymdownx.arithmatex:
    generic: true
  admonition: {}
  pymdownx.details: {}
  pymdownx.tabbed:
    alternate_style: true
  attr_list: {}
  md_in_html: {}

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adrianwix/pybasin
      name: GitHub
