INHERIT: mkdocs.base.yml

site_name: TorrStack
site_description: Scientific computing tools for dynamical systems and time-series analysis
site_url: https://adrianwix.github.io/pybasin/

docs_dir: docs
site_dir: site

hooks:
  - docs_tools/hooks.py

plugins:
  search: {}
  macros:
    module_name: docs_tools/macros

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - PyBasin: !ENV [PYBASIN_DOCS_URL, "https://adrianwix.github.io/pybasin/pybasin/"]
  - TSTorch: !ENV [TSTORCH_DOCS_URL, "https://adrianwix.github.io/pybasin/tstorch/"]
  - Case Studies:
      - Overview: case-studies/overview.md
      - Pendulum: case-studies/pendulum.md
      - Duffing Oscillator: case-studies/duffing.md
      - Lorenz System: case-studies/lorenz.md
      - Friction Oscillator: case-studies/friction.md
      - Rossler Network: case-studies/rossler-network.md
  - Development:
      - Contributing: development/contributing.md
      - Releasing: development/releasing.md
